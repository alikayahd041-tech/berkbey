
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>berkbey</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.bg{position:fixed;inset:0;background:linear-gradient(#0008,#000b),url('https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1400&q=85') center/cover;filter:grayscale(1);transform:scale(1.03)}
main{position:relative;text-align:center;width:min(420px,90%);padding:40px 20px}
.logo{width:135px;height:135px;border:1px solid #ffffff55;border-radius:50%;margin:auto auto 24px;display:grid;place-items:center;background:#1119;font-size:48px;font-weight:200;letter-spacing:5px;box-shadow:0 0 45px #ffffff12}
h1{font-size:32px;letter-spacing:5px;margin:0 0 12px}
p{color:#c5c5c5;letter-spacing:2px;font-size:14px}
.links{display:flex;gap:12px;justify-content:center;margin-top:35px}
a,button{color:white;text-decoration:none;background:#ffffff12;border:1px solid #ffffff30;border-radius:30px;padding:14px 22px;font-size:15px;cursor:pointer}
a:hover,button:hover{background:#ffffff2a}
.music{margin-top:35px}
#status{font-size:12px;color:#aaa;letter-spacing:1px;margin-top:12px}
footer{margin-top:55px;color:#777;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<div class="bg"></div>
<main>
<div class="logo">B</div>
<h1>berkbey</h1>
<p>Alone....</p>
<div class="links">
<a href="https://www.instagram.com/p/DEAPF6Zoezk/?rpxt=ZXhob2RsZmRoOTd4" target="_blank" rel="noopener">Instagram ↗</a>
<a href="https://discord.com/" target="_blank" rel="noopener">Discord ↗</a>
</div>
<div class="music">
<button id="play">▶ Müziği başlat</button>
<div id="status">CINEMATIC EXPERIENCE</div>
</div>
<footer>BERKBEY · PERSONAL SPACE</footer>
</main>
<audio id="audio" loop preload="none"></audio>
<script>
const audio=document.getElementById('audio');
const btn=document.getElementById('play');
btn.onclick=async()=>{
 if(audio.paused){
  if(!audio.src){
   audio.src='https://cdn.pixabay.com/audio/2022/03/15/audio_783c8c7e7b.mp3';
   audio.volume=0.35;
  }
  try{await audio.play();btn.textContent='Ⅱ Müziği durdur';document.getElementById('status').textContent='NOW PLAYING'}
  catch(e){document.getElementById('status').textContent='Müzik açılamadı; daha sonra tekrar dene.'}
 }else{audio.pause();btn.textContent='▶ Müziği başlat';document.getElementById('status').textContent='PAUSED'}
};
</script>
</body>
</html>
